<!doctype html>
<html><head><meta charset="utf-8"><title>frame</title>
<style>
  :root { --w: 1080px; --h: 1920px; }
  html, body { margin: 0; width: var(--w); height: var(--h); overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  body { position: relative; color: #FBF5F2;
    background:
      radial-gradient(circle at 18% 8%, rgba(196,52,72,.85) 0%, rgba(142,31,46,.45) 30%, rgba(142,31,46,0) 60%),
      radial-gradient(circle at 92% 88%, rgba(180,86,28,.45) 0%, rgba(180,86,28,0) 45%),
      linear-gradient(170deg, #3A1018 0%, #1C080C 55%, #0A0607 100%); }
  .cap { position: absolute; left: 0; right: 0; top: calc(var(--h) * .055); text-align: center; padding: 0 calc(var(--w) * .08); }
  .eyebrow { font-family: Consolas, "Courier New", monospace; letter-spacing: .14em; text-transform: uppercase; color: #F2C14E;
    font-size: calc(var(--w) * .03); margin-bottom: calc(var(--w) * .025); }
  h1 { margin: 0; font-weight: 700; letter-spacing: -.02em; line-height: 1.08; font-size: calc(var(--w) * .078); }
  .phone { position: absolute; left: 50%; transform: translateX(-50%); top: calc(var(--h) * .235);
    width: calc(var(--w) * .74); aspect-ratio: 1320 / 2868; border-radius: calc(var(--w) * .075); overflow: hidden;
    box-shadow: 0 0 0 calc(var(--w) * .012) #120709, 0 0 0 calc(var(--w) * .014) rgba(255,236,228,.18), 0 40px 120px rgba(0,0,0,.6); }
  .phone img { width: 100%; height: 100%; display: block; }
</style></head>
<body>
  <div class="cap"><div class="eyebrow" id="eb"></div><h1 id="t"></h1></div>
  <div class="phone"><img id="img" alt=""></div>
<script>
  // #<shot file>|<eyebrow>|<title>|<width>|<height>
  const [shot, eb, title, w, h] = decodeURIComponent(location.hash.slice(1)).split('|');
  document.documentElement.style.setProperty('--w', w + 'px');
  document.documentElement.style.setProperty('--h', h + 'px');
  document.getElementById('img').src = '../raw/shots/' + shot + '.png';
  document.getElementById('eb').textContent = eb;
  document.getElementById('t').textContent = title;
</script>
</body></html>
