<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(circle at 26% 18%, rgba(196, 52, 72, .95) 0%, rgba(142, 31, 46, .55) 32%, rgba(142, 31, 46, 0) 62%),
      radial-gradient(circle at 86% 92%, rgba(180, 86, 28, .55) 0%, rgba(180, 86, 28, 0) 50%),
      linear-gradient(160deg, #3A1018 0%, #1C080C 55%, #0A0607 100%); }
  .shine { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% -10%, rgba(255,236,228,.18), rgba(255,236,228,0) 55%); }
  svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); filter: drop-shadow(0 18px 40px rgba(0,0,0,.45)); }
  body.mono svg { filter: none; }
</style></head>
<body>
<div class="bg" id="bg"></div><div class="shine" id="shine"></div>
<svg id="g" viewBox="0 0 24 24" width="560" height="560">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A3"/><stop offset=".45" stop-color="#F2C14E"/><stop offset="1" stop-color="#C98A1E"/>
    </linearGradient>
  </defs>
  <g id="w" fill="none" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18a2 2 0 0 1 2 2v1.5"/>
    <rect x="3" y="8" width="18" height="12" rx="3"/>
  </g>
  <circle id="dot" cx="16.5" cy="14" r="1.35" fill="url(#gold)"/>
</svg>
<script>
  // #full (store icon, opaque) | #fg (adaptive foreground, safe zone) | #bg (adaptive background) | #mono | #splash
  const mode = location.hash.slice(1) || 'full';
  const g = document.getElementById('g');
  const hide = (id) => (document.getElementById(id).style.display = 'none');
  if (mode === 'fg' || mode === 'mono' || mode === 'splash') { hide('bg'); hide('shine'); g.setAttribute('width', 400); g.setAttribute('height', 400); }
  if (mode === 'bg') hide('g');
  if (mode === 'mono') {
    document.body.className = 'mono';
    document.getElementById('w').setAttribute('stroke', '#FFFFFF');
    document.getElementById('dot').setAttribute('fill', '#FFFFFF');
  }
</script>
</body></html>
