<!doctype html>
<html><head><meta charset="utf-8"><title>banner</title>
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #FBF5F2; }
  body { position: relative;
    background:
      radial-gradient(circle at 14% 12%, rgba(196,52,72,.9) 0%, rgba(142,31,46,.45) 30%, rgba(142,31,46,0) 62%),
      radial-gradient(circle at 88% 100%, rgba(180,86,28,.55) 0%, rgba(180,86,28,0) 50%),
      linear-gradient(160deg, #3A1018 0%, #1C080C 55%, #0A0607 100%); }
  .left { position: absolute; left: 64px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .name { font-family: Consolas, "Courier New", monospace; letter-spacing: .14em; font-size: 24px; text-transform: uppercase; }
  h1 { margin: 0; font-size: 50px; line-height: 1.06; letter-spacing: -.02em; font-weight: 700; }
  h1 b { color: #F2C14E; font-weight: 700; }
  .chips { display: flex; gap: 10px; }
  .chip { font-family: Consolas, "Courier New", monospace; font-size: 15px; letter-spacing: .08em; padding: 10px 16px; border-radius: 999px; background: rgba(255,236,228,.12); }
  .phone { position: absolute; right: 70px; top: 46px; width: 300px; aspect-ratio: 1320 / 2868; border-radius: 34px; overflow: hidden; transform: rotate(-6deg);
    box-shadow: 0 0 0 7px #120709, 0 0 0 8px rgba(255,236,228,.2), 0 30px 80px rgba(0,0,0,.6); }
  .phone img { width: 100%; display: block; }
</style></head>
<body>
  <div class="left">
    <div class="brand"><img src="../play/icon-512.png" alt=""><div class="name">Raqamli Hamyon</div></div>
    <h1>Pullaringizni <b>raqamli nazorat</b> qiling</h1>
    <div class="chips"><span class="chip">HAMYONLAR</span><span class="chip">XARAJATLAR</span><span class="chip">HISOBOT</span></div>
  </div>
  <div class="phone"><img src="../raw/shots/1-home.png" alt=""></div>
</body></html>
