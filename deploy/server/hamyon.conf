# Raqamli Hamyon API (mobil ilova sinxronlash serveri) — ~/apps/raqamli-hamyon
# O‘rnatish: ~/server-infra/nginx/conf.d/ ga nusxalab, nginx -t va reload.
server {
    listen 80;
    server_name hamyon.raqamlinazorat.uz;

    client_max_body_size 20m;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://hamyon_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
